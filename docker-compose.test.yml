name: coursecoach-community-test
x-test-env: &test-env
  APP_ENV: test
  ALLOW_MOCK_AUTH: "true"
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: coursecoach_community_test
  DB_USER: coursecoach
  DB_PASSWORD: test_only_password
  UPLOADS_DIR: /tmp/coursecoach-test-uploads
  AVATARS_DIR: /tmp/coursecoach-test-avatars
  SESSION_SECRET: isolated-community-test-secret
  COOKIE_SECURE: "false"
  GOOGLE_CLIENT_ID: test-client-id
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coursecoach
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: coursecoach_community_test
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursecoach -d coursecoach_community_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: ./backend
    environment: *test-env
    volumes: ["./backend:/app:ro", "./db/community:/migrations:ro"]
    command: ["python", "migrate.py"]
    depends_on:
      db: {condition: service_healthy}
  test:
    build: {context: ./backend, dockerfile: Dockerfile.test}
    environment: *test-env
    volumes: ["./backend:/app:ro", "./db/community:/migrations:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
