# LOCAL community redesign. All volumes/names are separate from the legacy stack.
# Start: docker compose up -d --build
# Never use down -v to switch versions; see LOCAL-REDESIGN.md.
name: coursecoach-community
x-app-env: &app-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: coursecoach_community
  DB_USER: coursecoach
  DB_PASSWORD: coursecoach_local_only
  APP_ENV: development
  WATCHFILES_FORCE_POLLING: "true"
  FILE_STORAGE: ${FILE_STORAGE:-local}
  CLOUDINARY_URL: ${CLOUDINARY_URL:-}
  UPLOADS_DIR: /data/uploads
  AVATARS_DIR: /data/avatars
  ALLOW_MOCK_AUTH: ${COMMUNITY_MOCK_AUTH:-true}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-610984601873-obcs09oonbadi58tvgkhr1sbr4muiv92.apps.googleusercontent.com}
  GOOGLE_ALLOWED_DOMAIN: kmitl.ac.th
  SESSION_SECRET: ${SESSION_SECRET:-community-local-dev-change-before-cloud}
  SESSION_COOKIE_NAME: coursecoach_community_session
  COOKIE_SECURE: "false"
  CORS_ORIGINS: http://localhost,http://localhost:3000
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: coursecoach
      POSTGRES_PASSWORD: coursecoach_local_only
      POSTGRES_DB: coursecoach_community
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["community_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursecoach -d coursecoach_community"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend
    environment: *app-env
    volumes: ["./db/community:/migrations:ro"]
    command: ["python", "migrate.py"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    restart: unless-stopped
    environment: *app-env
    ports: ["127.0.0.1:5001:5000"]
    volumes:
      - ./backend:/app:ro
      - community_uploads:/data/uploads
      - community_avatars:/data/avatars
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:${COMMUNITY_WEB_PORT:-80}:3000"]
    environment: {CHOKIDAR_USEPOLLING: "true"}
    volumes: ["./frontend/src:/app/src:ro", "./frontend/vite.config.js:/app/vite.config.js:ro"]
    depends_on: [backend]
  seed-mock:
    profiles: [tools]
    image: postgres:16
    environment: {PGPASSWORD: coursecoach_local_only}
    volumes: ["./db/dev:/seed:ro"]
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "coursecoach", "-d", "coursecoach_community", "-f", "/seed/seed_mock.sql"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  community_db:
  community_uploads:
  community_avatars:
