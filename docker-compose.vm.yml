# Use with docker-compose.yml on the VM. Keep the same project and volumes.
# docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --build
services:
  backend:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vm
